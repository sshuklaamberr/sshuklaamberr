name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"     # runs daily at midnight UTC
  workflow_dispatch:         # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: sshuklaamberr
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#C9A227&color_dots=#1A1A1E,#2B2B30,#3D3D42,#C9A227,#D9BC5C
            dist/github-contribution-grid-snake-dark.svg?color_snake=#C9A227&color_dots=#0A0A0C,#1A1A1E,#2B2B30,#C9A227,#D9BC5C

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
