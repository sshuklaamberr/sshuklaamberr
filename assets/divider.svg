<svg width="1200" height="36" viewBox="0 0 1200 36" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A227" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="200" y1="18" x2="1000" y2="18" stroke="url(#dGrad)" stroke-width="1"
        stroke-dasharray="800" stroke-dashoffset="800">
    <animate attributeName="stroke-dashoffset" from="800" to="0" dur="1.4s" begin="0s" fill="freeze"/>
  </line>
  <rect x="596" y="14" width="8" height="8" fill="#C9A227" opacity="0" transform="rotate(45 600 18)">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="1.4s" fill="freeze"/>
  </rect>
</svg>
