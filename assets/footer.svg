<svg width="1200" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fbgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A0A0C"/>
      <stop offset="50%" stop-color="#131316"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
    <linearGradient id="flineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D9BC5C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" fill="url(#fbgGrad)"/>

  <line x1="350" y1="55" x2="850" y2="55" stroke="url(#flineGrad)" stroke-width="1.2"
        stroke-dasharray="500" stroke-dashoffset="500">
    <animate attributeName="stroke-dashoffset" from="500" to="0" dur="1.3s" begin="0.1s" fill="freeze"/>
  </line>

  <text x="600" y="90" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" letter-spacing="4.5" fill="#6B6B6F" opacity="0">
    THANK YOU FOR VISITING
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.1s" fill="freeze"/>
  </text>

  <line x1="440" y1="112" x2="760" y2="112" stroke="#C9A227" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;0.35;0" dur="4s" begin="2s" repeatCount="indefinite"/>
  </line>
</svg>
