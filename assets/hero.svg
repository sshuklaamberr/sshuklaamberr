<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0C"/>
      <stop offset="100%" stop-color="#131316"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D9BC5C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="278" fill="none" stroke="#C9A227" stroke-opacity="0.18" stroke-width="1"/>

  <!-- corner marks -->
  <g stroke="#C9A227" stroke-width="1.2" stroke-opacity="0.55">
    <path d="M28,20 L28,40 M28,20 L48,20"/>
    <path d="M1172,20 L1172,40 M1172,20 L1152,20"/>
    <path d="M28,260 L28,240 M28,260 L48,260"/>
    <path d="M1172,260 L1172,240 M1172,260 L1152,260"/>
  </g>

  <text x="600" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="9" fill="#F5F1E8" opacity="0">
    AMBER SHUKLA
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" begin="0.1s" fill="freeze"/>
  </text>

  <text x="600" y="168" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" letter-spacing="5.5" fill="#C9A227" opacity="0">
    FULL-STACK DEVELOPER &#8226; SRM UNIVERSITY
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.9s" fill="freeze"/>
  </text>

  <!-- drawing underline -->
  <line x1="500" y1="196" x2="700" y2="196" stroke="url(#lineGrad)" stroke-width="1.4"
        stroke-dasharray="200" stroke-dashoffset="200">
    <animate attributeName="stroke-dashoffset" from="200" to="0" dur="1s" begin="1.5s" fill="freeze"/>
  </line>

  <!-- diamond accents at underline ends -->
  <g fill="#C9A227" opacity="0">
    <rect x="496" y="192" width="8" height="8" transform="rotate(45 500 196)"/>
    <rect x="696" y="192" width="8" height="8" transform="rotate(45 700 196)"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.4s" fill="freeze"/>
  </g>

  <!-- ambient shimmer line, loops forever -->
  <line x1="440" y1="222" x2="760" y2="222" stroke="#C9A227" stroke-width="0.6" opacity="0">
    <animate attributeName="opacity" values="0;0.4;0" dur="4s" begin="3s" repeatCount="indefinite"/>
  </line>

  <text x="600" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#6B6B6F" opacity="0">
    B.TECH COMPUTER SCIENCE &#8226; CLASS OF 2028
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="2.6s" fill="freeze"/>
  </text>
</svg>
